name: Portable paper checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  synthetic-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            legacy/weekly-paper/requirements.txt
            legacy/weekly-paper/requirements-rev12.txt
      - name: Install pinned dependencies
        run: python -m pip install -r legacy/weekly-paper/requirements-rev12.txt
      - name: Validate portable synthetic comparison
        run: python scripts/validate_portable.py
